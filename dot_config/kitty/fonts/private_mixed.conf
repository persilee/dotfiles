# =========================================================
# mixed.conf —— 混合字体配置
# 正常字形：FiraCode Nerd Font Mono（带连字特性）
# 粗体：    Comic Mono Bold
# 斜体：    Maple Mono NF CN Italic（含中文字形，注释斜体协调）
# 粗斜体：  Maple Mono NF CN Bold Italic（Comic Mono 无 Italic 变体，
#           粗斜体场景由 Maple 兜底；想改回 Comic 可试 style="Bold Italic"）
# =========================================================

# 正常字形：Fira Code
font_family      family="Fira Code" style="Regular"

# 粗体：Comic Mono（圆润漫画风）
bold_font        family="Maple Mono NF CN" style="Bold"

# 斜体：Maple Mono NF CN（中文注释斜体由它提供）
italic_font      family="Maple Mono NF CN" style="Italic"

# 粗斜体：Maple Mono NF CN Bold Italic
bold_italic_font family="Maple Mono NF CN" style="Bold Italic"

# Fira Code 连字特性（仅作用于 Fira 正常字形）
font_features        FiraCodeNF-Reg +cv01 +ss02 +ss04 +ss05
# Maple 中文斜体特性（斜体/粗斜体字形）
font_features        MapleMono-NF-CN-Italic +cv01 +calt
font_features        MapleMono-NF-CN-BoldItalic +cv01 +calt
