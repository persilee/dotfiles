# ============================================================================
# Kitty 终端主配置文件
# 按功能分类组织，每行注释说明该配置的作用
# 官方文档: https://sw.kovidgoyal.net/kitty/conf.html
# ============================================================================

# ---------------------------------------------------------------
# 1. 基础设置：Shell 与交互行为
# ---------------------------------------------------------------

# 新窗口/新标签启动时的工作目录：跟随当前 shell 所在目录
shell .

# no-rc 停止自动注入 ZDOTDIR（避免与自定义 ZDOTDIR 冲突），保留 no-cursor（光标交给 zsh-vi-mode）
shell_integration no-rc no-cursor

# 允许通过 kitty @ 远程控制当前终端实例（配合外部脚本/工具使用）
allow_remote_control   yes
listen_on unix:/tmp/pigma-kitty.sock

# 选中文本即自动复制到系统剪贴板
copy_on_select         yes

# 双击选择的时间间隔（秒）；-1 表示禁用双击选择（只保留单击/三击）
click_interval        -1.0

# ---------------------------------------------------------------
# 2. 字体设置
# ---------------------------------------------------------------

# 加载字体配置文件（指定主字体家族与字重）
include                fonts/jetbrain.conf

# 主字体家族声明（与 fonts/maplemono.conf 保持一致）：
# kitty 原生字体参数以 include 文件为准；此处重复声明是为了让 fastfetch 等
# 工具能通过解析本文件兜底获取字体名（在 tmux 内 DCS 字体查询被拦截时）
font_family            family="JetBrains Mono"

# 主字体大小（磅值）
font_size              14

# 行高调整：+6%（正值增大行高/行距，0 为默认）
adjust_line_height 5

# 中文由主字体 Maple Mono NF CN 直接渲染（该字体自带完整中文字形），
# 不再单独 symbol_map，这样中文才能跟随 italic/bold 样式切换
symbol_map             U+4E00-U+9FFF,U+3400-U+4DBF Maple Mono NF CN
# 特殊字符区段（Nerd Font 图标、Powerline 符号、Unicode 私有区等）
symbol_map             U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# 仅当光标移动经过时禁用连字（正常显示代码时保留连字效果）
disable_ligatures      cursor

# 边框绘制字符的缩放比例（兼容不同字体的粗细/对齐差异）
# 必须提供四个数值，分别对应细线条、常规线条、粗线条和特粗线条。
box_drawing_scale      0.5, 0.8, 1.0, 1.5

# ---------------------------------------------------------------
# 3. 窗口外观
# ---------------------------------------------------------------

# 隐藏窗口装饰，仅保留标题栏（macOS 下更简洁）
hide_window_decorations        titlebar-only

# 关闭最后一个窗口时同时退出 Kitty（macOS 行为）
macos_quit_when_last_window_closed yes

# 关闭动态背景透明度（固定使用下方 background_opacity 的值）
dynamic_background_opacity     yes

# 终端背景透明度：1.0 为完全不透明
background_opacity             0.6

# 背景模糊强度：0 表示关闭（仅在透明度 < 1 时有意义）
background_blur                36

# 窗口内容四周的内边距（像素），让内容不贴边
window_padding_width           12

# 新窗口在屏幕上的放置策略：从左上角开始排布
placement_strategy             top-left

# 右上角窗口 Logo（图标）的缩放倍数
window_logo_scale              5

# 窗口 Logo 的透明度：0.25 表示较淡
window_logo_alpha              0.25

# 窗口 Logo 的位置：右上角
window_logo_position           top-right

# ---------------------------------------------------------------
# 4. 光标样式与特效
# ---------------------------------------------------------------
# 光标着色器列表
custom_shaders cursor-trail-motion-blur

# 光标形状：方块（block）
cursor_shape block

# 光束光标的厚度
cursor_beam_thickness 2

# 光标移动时拖出的轨迹长度（像素级）
cursor_trail 20

# 光标轨迹的起始触发阈值（光标移动超过该距离才显示轨迹）
# cursor_trail_start_threshold 10

# 光标轨迹的衰减参数（控制轨迹消失速度）
cursor_trail_decay 0.0 0.3

# 光标闪烁间隔：0 表示不闪烁
cursor_blink_interval 0

# ---------------------------------------------------------------
# 5. 鼠标与滚动
# ---------------------------------------------------------------

# 关闭 URL 自动检测（不自动下划线高亮可点击链接）
detect_urls no

# 鼠标停留超过该秒数后自动隐藏光标（默认 10 秒；已注释 = 使用默认值）
# mouse_hide_wait 10.0

# 启用逐像素滚动（滚动更平滑，替代按行滚动）
pixel_scroll yes

# ---------------------------------------------------------------
# 6. 标签栏（Tab Bar）
# ---------------------------------------------------------------

# 标签栏位置：屏幕底部
tab_bar_edge                top

# 标签栏样式：powerline 风格（带分隔箭头）
tab_bar_style               powerline

# powerline 风格的分隔符形状：圆角
tab_powerline_style         round

# ---------------------------------------------------------------
# 7. 快捷键映射
# ---------------------------------------------------------------

# 加载独立的快捷键映射文件（unmap/kitty/tmux/vim/hints 分组）
include mappings.conf

# ---------------------------------------------------------------
# 8. 主题配色（由主题管理工具维护，勿手改 BEGIN/END 之间内容）
# ---------------------------------------------------------------

# BEGIN_KITTY_THEME
# Catppuccin-Mocha or Dracula
include dracula.conf
# END_KITTY_THEME

# ---------------------------------------------------------------
# 标签栏配色固定覆盖：保持 Catppuccin-Mocha 风格（不受主题文件影响）
# ---------------------------------------------------------------

# 激活标签：深色文字 / 薰衣草紫背景
active_tab_foreground   #1E1E2E
active_tab_background   #CBA6F7

# 未激活标签：浅色文字 / 近黑背景
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825

# 标签栏整体背景：none = 跟随终端背景色（当前为半透明 + 毛玻璃效果）
tab_bar_background      none

# ---------------------------------------------------------------
# 9. 日志标记高亮（mark）颜色：覆盖主题中的默认标记配色
# ---------------------------------------------------------------

# 标记级别 1（INFO）：前景蓝 / 背景深底
mark1_foreground #74c7ec
mark1_background #1E1E2E

# 标记级别 2（WARNING）：前景黄 / 背景深底
mark2_foreground #F9E2AF
mark2_background #1E1E2E

# 标记级别 3（ERROR/FATAL）：前景粉红 / 背景深底
mark3_foreground #F38BA8
mark3_background #1E1E2E

# 快捷键：Ctrl+Shift+M 切换日志标记高亮，按级别高亮关键字
# 级别 1 = INFO、2 = WARNING、3 = ERROR/FATAL
map ctrl+shift+m toggle_marker regex 1 \\bINFO\\b 2 \\bWARNING\\b 3 \\bERROR\\b 3 \\bFATAL\\b
