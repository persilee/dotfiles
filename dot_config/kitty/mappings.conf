# vim:filetype=kitty
# vim:fdm=marker

# ============================================================================
# Kitty 快捷键映射文件（由 kitty.conf 通过 include 加载）
# 分组：unmap / kitty / tmux / vim / hints
# ============================================================================

# ---------------------------------------------------------------
# 1. unmap：禁用与系统或其他应用冲突的默认快捷键
# no_op 表示绑定到"无操作"，即完全禁用该组合键
# ---------------------------------------------------------------

# 禁用 Cmd+F（避免与查找类系统功能冲突）
map cmd+f no_op

# 禁用 Alt+Shift+H / Alt+Shift+L（防误触，或腾出给其他程序使用）
map alt+shift+h no_op
map alt+shift+l no_op

# 禁用 Cmd+Shift+W（kitty 默认关闭窗口，改为由下方 tmux 转发键接管）
map cmd+shift+w no_op

# 禁用 Cmd+Shift+D（默认 detach 类操作，防止误触）
map cmd+shift+d no_op

# 禁用 Ctrl+Shift+R（防止误触触发重载/重绘）
map ctrl+shift+r no_op

# 禁用 Cmd+Enter（防止误触全屏等操作）
# map cmd+enter no_op

# 禁用 Cmd+R
# map cmd+r no_op

# 禁用 Cmd+` 与 Cmd+Shift+`（macOS 上用于切换窗口，避免误触）
map cmd+` no_op
map cmd+shift+` no_op

# 禁用 Ctrl+Shift+U 触发的字符输入面板
map ctrl+shift+u no_op

# ---------------------------------------------------------------
# 2. kitty：标签页与窗口管理
# ---------------------------------------------------------------

# Cmd+Alt+1~9：跳转到对应编号的标签页
map cmd+alt+1 goto_tab 1
map cmd+alt+2 goto_tab 2
map cmd+alt+3 goto_tab 3
map cmd+alt+4 goto_tab 4
map cmd+alt+5 goto_tab 5
map cmd+alt+6 goto_tab 6
map cmd+alt+7 goto_tab 7
map cmd+alt+8 goto_tab 8
map cmd+alt+9 goto_tab 9

# Ctrl+Tab / Ctrl+Shift+Tab：在标签页之间前后切换
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Ctrl+Shift+T：以当前目录新建标签页
map ctrl+shift+t new_tab_with_cwd

# F5：上下分屏
map f5 launch --location=hsplit

# F6：左右分屏
map f6 launch --location=vsplit

# 创建一个新窗口，分割现有窗口占用的空间。
# 如果原有窗口较宽，则两个窗口并排摆放；
# 如果原有窗口较高，则两个窗口上下堆叠摆放。
map f4 launch --location=split

# 旋转当前分栏，将其分栏轴从垂直改为水平，或从水平改为垂直
map f7 layout_action rotate

# Ctrl+Shift+N：新建操作系统级窗口
map ctrl+shift+n new_os_window

# Ctrl+Shift+F：打开滚动回看（搜索历史输出）
map ctrl+shift+f show_scrollback

# Ctrl+Shift+H/J/K/L：移动焦点到左/下/上/右相邻窗口（Vim 风格）
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Ctrl+Shift+Z：切换当前布局为堆叠（stack）布局
map ctrl+shift+z toggle_layout stack

# 最大化
map cmd+enter toggle_maximized

# ---------------------------------------------------------------
# 3. tmux：把组合键透传给 tmux
# 原理：先发送 tmux 前缀键 Ctrl+a，再发送对应子命令键
# ---------------------------------------------------------------

# Cmd+Shift+W：发送前缀 + w → tmux 拆离当前会话（detach）
map cmd+shift+w combine : send_key ctrl+a : send_key w

# 禁用 Cmd+W（kitty 默认关闭窗口，防止误关；tmux 操作走前缀键）
map cmd+w no_op

# 以下组合曾被规划为 tmux 窗格操作，暂时注释保留备选
# map cmd+n combine : send_key ctrl+space : send_key "
# map cmd+n combine : send_key ctrl+space : send_key i
# map cmd+shift+n combine : send_key ctrl+space : send_key "

# Cmd+Z：发送前缀 + z → tmux 全屏/还原当前窗格（zoom）
map cmd+z combine : send_key ctrl+a : send_key z

# Cmd+Shift+H：发送前缀 + 空格 → tmux 循环切换窗格布局
map cmd+shift+h combine : send_key ctrl+a : send_key space

map cmd+1 combine : send_key ctrl+a : send_key 1
map cmd+2 combine : send_key ctrl+a : send_key 2
map cmd+3 combine : send_key ctrl+a : send_key 3
map cmd+4 combine : send_key ctrl+a : send_key 4
map cmd+5 combine : send_key ctrl+a : send_key 5
map cmd+6 combine : send_key ctrl+a : send_key 6
map cmd+7 combine : send_key ctrl+a : send_key 7
map cmd+8 combine : send_key ctrl+a : send_key 8
map cmd+9 combine : send_key ctrl+a : send_key 9

# ---------------------------------------------------------------
# 4. vim/Neovim：向编辑器发送文本命令（send_text all 作用于所有窗格）
# ---------------------------------------------------------------

# Cmd+S：Esc 后执行 :w 回车 → 保存当前文件
map cmd+s send_text all \e:w\r

# Cmd+W：Esc 后执行 :q 回车 → 退出 Neovim
# 注意：此映射覆盖 Kitty 默认的 Cmd+W（关闭当前窗口）
map cmd+w send_text all \e:q\r

# Cmd+P：执行 Lua 调用 Snacks.picker.smart() → 智能模糊查找文件
map cmd+p send_text all :lua Snacks.picker.smart()\r

# Cmd+O：执行 Lua 调用 Snacks.picker.lsp_workspace_symbols() → 查找 LSP 工作区符号
map cmd+o send_text all :lua Snacks.picker.lsp_workspace_symbols()\r

# 以下为历史/备选 vim 映射，暂注释保留
# map cmd+/ combine : send_key space : send_key /
# map cmd+shift+s send_text all \e\e:Telescope lsp_document_symbols \r
# map cmd+g send_text all \e:LazyGitCurrentFile\r
# map cmd+shift+g send_text all \e\e:Telescope git_submodules\r
# map cmd+shift+r send_text all \e\e:OverseerQuickAction\r
# map cmd+o send_text all :Telescope find_files\r
# map cmd+shift+f send_text all :Telescope live_grep_args\r
# map cmd+b send_text all :Neotree toggle\r

# ---------------------------------------------------------------
# 5. macOS 选项键：把 Option 当作 Alt 键使用
# （终端程序依赖 Alt 产生 ESC 前缀，如 vim 的 Alt 组合键）
# ---------------------------------------------------------------
macos_option_as_alt yes

# ---------------------------------------------------------------
# 6. hints：用 kitten 提示功能快速选取屏幕文本
# ---------------------------------------------------------------

# Ctrl+Shift+P：高亮路径类文本，选中后在 tmux 浮窗（popup，宽60%高50%居中）中用 nvim 打开
# nvim 退出后浮窗自动关闭；需在 tmux 会话内使用（tmux 用绝对路径，Kitty 的 PATH 不含 homebrew）
map ctrl+shift+o kitten hints --type path --program "/opt/homebrew/bin/tmux display-popup -w 60% -h 50% -E /Users/lishaoying/.local/share/bob/nvim-bin/nvim"

# 复制高亮路径文本
map ctrl+shift+p kitten hints --type path --program @

# Ctrl+Shift+H：曾用于高亮 hash 文本，暂注释保留
# map ctrl+shift+h kitten hints --type hash --program @

# Ctrl+Shift+D：使用自定义脚本 custom_match.py 处理匹配文本，输出到标准输出
map ctrl+shift+d kitten hints --customize-processing ~/.config/kitty/helpers/custom_match.py --program -

# ---------------------------------------------------------------
# 7. 自定义快捷键
# ---------------------------------------------------------------

# Cmd+; ：发送右箭头（等效于按下 → 键）
map cmd+semicolon send_key right

# Cmd+K ：输入 clear 并回车（命令行清屏效果）
map cmd+k send_text all clear\r
