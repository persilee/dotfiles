# =========================================================
# tmux.reset.conf —— tmux 键位绑定配置
# 由 tmux.conf 通过 source-file 加载
# 本文件定义「前缀键 Ctrl+A 按下后」的常用操作键位
# 注：原文件开头的"清空全部默认键位"（unbind-key -a）保持注释状态，
#     因此以下绑定与 tmux 默认键位共存，同名绑定以本文件后定义者为准
# =========================================================
# First remove *all* keybindings   # 原模板：先清空全部默认键位（已注释停用）
# unbind-key -a                    # 清空全部键位的命令（保持注释，不启用）
# Now reinsert all the regular tmux keys  # 原模板说明：以下重新绑定常用键位
# ---------------------------------------------------------
# 1. 会话级操作（前缀 + 键）
# ---------------------------------------------------------
bind ^X lock-server            # 前缀+Ctrl+X：锁定 tmux 服务（需输入密码解锁）
bind ^C new-window -c "$HOME"  # 前缀+Ctrl+C：在 HOME 目录新建窗口（覆盖默认 Ctrl+C 中断）
bind ^D detach                 # 前缀+Ctrl+D：分离当前会话（回到 shell）
bind * list-clients            # 前缀+*：列出连接到当前 tmux 的客户端

# ---------------------------------------------------------
# 2. 窗口切换（前缀 + 键）
# ---------------------------------------------------------
bind H previous-window         # 前缀+H：切换到上一个窗口
bind L next-window             # 前缀+L：切换到下一个窗口

# ---------------------------------------------------------
# 3. 窗口重命名 / 列表 / 缩放 / 刷新（前缀 + 键）
# ---------------------------------------------------------
bind r command-prompt "rename-window %%"   # 前缀+r：重命名当前窗口
bind ^A last-window            # 前缀+Ctrl+A：切回最近使用过的窗口
bind ^W list-windows           # 前缀+Ctrl+W：列出所有窗口
bind w list-windows            # 前缀+w：列出所有窗口（同上，便于记忆）
bind z resize-pane -Z          # 前缀+z：当前窗格全屏 / 还原（zoom）
bind ^L refresh-client         # 前缀+Ctrl+L：刷新客户端屏幕
bind l refresh-client          # 前缀+l：刷新客户端屏幕（下方 l 又绑定为右移，后定义覆盖）
# ---------------------------------------------------------
# 4. 窗格分割与窗口选择（前缀 + 键）
# ---------------------------------------------------------
bind | split-window            # 前缀+|：水平分割（左右两个窗格）
bind s split-window -v -c "#{pane_current_path}"  # 前缀+s：垂直分割，新窗格继承当前路径
bind v split-window -h -c "#{pane_current_path}"  # 前缀+v：水平分割，新窗格继承当前路径
bind '"' choose-window         # 前缀+"：交互式选择要切换的窗口
# ---------------------------------------------------------
# 5. 窗格焦点移动（前缀 + hjkl，Vim 风格）
# ---------------------------------------------------------
bind h select-pane -L          # 前缀+h：焦点移到左边窗格
bind j select-pane -D          # 前缀+j：焦点移到下边窗格
bind k select-pane -U          # 前缀+k：焦点移到上边窗格
bind l select-pane -R          # 前缀+l：焦点移到右边窗格（覆盖上方 l 的刷新绑定）
# ---------------------------------------------------------
# 6. 窗格大小调整（前缀 + 键，-r 支持连续按）
# ---------------------------------------------------------
bind -r -T prefix , resize-pane -L 20  # 前缀+,：当前窗格左边增宽 20（可连续按）
bind -r -T prefix . resize-pane -R 20  # 前缀+.：当前窗格右边增宽 20（可连续按）
bind -r -T prefix - resize-pane -D 7   # 前缀+-：当前窗格下边增高 7（可连续按）
bind -r -T prefix = resize-pane -U 7   # 前缀+=：当前窗格上边增高 7（可连续按）
# ---------------------------------------------------------
# 7. 其它常用命令（前缀 + 键）
# ---------------------------------------------------------
bind : command-prompt          # 前缀+：进入 tmux 命令行（可输入 tmux 命令）
bind * setw synchronize-panes  # 前缀+*：所有窗格同步输入（覆盖上方 list-clients，以后者为准）
bind P set pane-border-status  # 前缀+P：切换窗格边框状态栏显示
bind c kill-pane               # 前缀+c：关闭当前窗格（覆盖默认 c=新建窗口）
bind x swap-pane -D            # 前缀+x：当前窗格与下方窗格交换位置
bind S choose-session          # 前缀+S：交互式选择切换的会话
bind R source-file ~/.config/tmux/tmux.conf   # 前缀+R：重新加载全部 tmux 配置
bind K send-keys "clear"\; send-keys "Enter"  # 前缀+K：清屏（等效输入 clear 回车）
# ---------------------------------------------------------
# 8. 复制模式（vi 键位）
# ---------------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection  # 复制模式（vi）中按 v 开始选择文本

# ---------------------------------------------------------
# 9. 无前缀快捷键（直接按，无需前缀键）
# ---------------------------------------------------------
bind -n S-Up resize-pane -U 5    # Shift+↑：上边窗格增高 5
bind -n S-Down resize-pane -D 5  # Shift+↓：下边窗格增高 5
bind -n S-Left resize-pane -L 5  # Shift+←：左边窗格增宽 5
bind -n S-Right resize-pane -R 5 # Shift+→：右边窗格增宽 5

bind -n M-S-Left swap-window -t -1 \; select-window -t -1   # Option+Shift+←：与左侧窗口交换并选中
bind -n M-S-Right swap-window -t +1 \; select-window -t +1  # Option+Shift+→：与右侧窗口交换并选中

# ---------------------------------------------------------
# 10. 弹出工具（前缀 + 键）
# ---------------------------------------------------------
bind g display-popup -d "#{pane_current_path}" -E -b none -w 80% -h 80% lazygit  # 前缀+g：当前路径弹出 lazygit 浮窗（80% 大小）
