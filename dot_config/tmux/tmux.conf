# =========================================================
# tmux.conf —— tmux 主配置
# 功能分区：终端颜色 / 扩展按键 / 全局设置 / 插件 / 主题 / 状态栏
# 加载顺序：tmux.reset.conf（键位）→ 本文件（基础+插件+主题）
# =========================================================

# ---------- 0. 键位配置（source 加载） ----------
source-file ~/.config/tmux/tmux.reset.conf
# ---------- 1. 终端与颜色 ----------
# 对内声明 tmux 原生终端类型，支持全部现代特性
set -g default-terminal "tmux-256color"
# 对所有外部终端追加真彩色能力，兼容 WezTerm/iTerm/Kitty
set -ga terminal-overrides ",*:Tc:RGB"
# 服务器级：对所有外部终端追加真彩色 + 扩展按键能力
set -s terminal-overrides ",*:Tc:RGB:extkeys"

# 全局窗口级：开启扩展按键
# ---------- 2. 扩展按键（CSI-u 协议） ----------
set -gw extended-keys off
# 全局窗口级：强制使用标准 CSI-u 格式输出
set -gw extended-keys-format csi-u


# ---------- 3. 全局基础设置 ----------
set -g prefix ^A
set -g base-index 1              # 窗口编号从 1 开始（默认从 0 开始）
set -g detach-on-destroy off     # 关闭最后一个窗口时不要退出 tmux
set -g escape-time 0             # Esc 键零延迟（响应更快）
set -g history-limit 1000000     # 回滚历史上限：100 万行（默认 2000 行）
set -g renumber-windows on       # 关闭任意窗口后自动重新编号
set -g set-clipboard on          # 复制时写入系统剪贴板
set -g status-position top       # 状态栏置于顶部（macOS 风格）
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g mouse on
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# ---------- 4. tmux-fzf-url 插件配置 ----------
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# ---------- 5. 插件声明（tpm 管理） ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# vim-tmux-navigator：手动 clone 在 ~/.config/tmux/plugins/，用 run-shell 加载（同 catppuccin 方式）
# 提供 tmux 侧 C-h/j/k/l 判断：pane 内是 vim 类程序则透传按键，否则切换 pane
run-shell ~/.config/tmux/plugins/vim-tmux-navigator/vim-tmux-navigator.tmux
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
# tmux-thumbs 激活键改为前缀 + t（默认是空格，会抢占布局循环键 prefix+Space）
set -g @thumbs-key 't'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
# ---------- 6. tmux-floax（浮动窗口） ----------
set -g @floax-width '80%'                  # 浮动窗口宽度：80%
set -g @floax-height '80%'                 # 浮动窗口高度：80%
set -g @floax-border-color 'magenta'       # 浮动窗口边框颜色：品红
set -g @floax-text-color 'blue'            # 浮动窗口标题文字颜色：蓝色
set -g @floax-bind 'p'                      # 前缀 + p：打开/关闭浮动窗口
set -g @floax-change-path 'true'            # 打开浮动窗口时切换到当前 pane 路径
# ---------- 7. tmux-sessionx（会话切换器） ----------
set -g @sessionx-bind-zo-new-window 'ctrl-y'   # 选择器内 Ctrl+Y：新建窗口并切换
set -g @sessionx-auto-accept 'off'             # 关闭自动接受首个匹配结果
set -g @sessionx-custom-paths '/Users/lishaoying/.config'  # 附加扫描路径
set -g @sessionx-bind 'o'                       # 前缀 + o：打开会话选择器
set -g @sessionx-x-path '~/dotfiles'            # 选择器默认起始目录
set -g @sessionx-window-height '85%'            # 选择器窗口高度：85%
set -g @sessionx-window-width '75%'             # 选择器窗口宽度：75%
set -g @sessionx-zoxide-mode 'on'               # 集成 zoxide（按频率记忆常用目录）
set -g @sessionx-custom-paths-subdirectories 'false'  # 不递归扫描子目录
set -g @sessionx-filter-current 'false'         # 结果中包含当前会话
# ---------- 8. 会话持久化（resurrect / continuum） ----------
set -g @resurrect-capture-pane-contents 'on'    # 恢复时还原各 pane 屏幕内容
set -g @continuum-restore 'on'                  # tmux 重启后自动恢复上次会话
set -g @continuum-save-interval '1'             # 自动保存间隔：1 分钟
set -g @resurrect-strategy-nvim 'session'       # nvim 恢复策略：按会话（session）恢复
# ---------- 9. catppuccin 主题 ----------
# 以下 @catppuccin_* 变量定制状态栏 / 窗口样式（分隔符含 Nerd Font 图标字符）
# 加载 catppuccin 主题
set -g @catppuccin_window_left_separator " "
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory" # date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%m-%d %H:%M"

# ---------- 10. 插件加载 ----------
run '~/.tmux/plugins/tpm/tpm'
# 显式把空格键绑定回 tmux 内置布局循环（next-layout），防止插件抢占 prefix+Space
bind space next-layout
# 手动加载 catppuccin-tmux（不在 tpm 管理目录，需手动 run-shell 才会重新生成状态栏）
run-shell ~/.config/tmux/plugins/catppuccin-tmux/catppuccin.tmux

# ---------- 11. 状态栏半透明 ----------
# 1. 状态栏背景用 default：Ghostty 下 tmux 的 default 背景会半透明（跟随终端 background-opacity），
#    标签/状态栏与终端背景融为一体，实现半透明效果
set -g status-bg default
set -g status-style "bg=default"
